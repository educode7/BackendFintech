quarkus:
  application:
    name: auth-service
    version: 1.0.0

  http:
    port: 8084
    host: 0.0.0.0

  oidc:
    auth-server-url: http://localhost:8180/realms/wallet
    client-id: wallet-backend
    credentials:
      secret: "9Jto5rgsmk2JUCbgg1W4hoBJe60soDCU"
    token:
      issuer: http://localhost:8180/realms/wallet

  smallrye-openapi:
    info-title: Auth Service API
    info-version: 1.0.0

  smallrye-health:
    enabled: true
    expose:
      enabled: true

  micrometer:
    export:
      prometheus:
        enabled: true

  otel:
    enabled: true
    exporter:
      otlp:
        protocol: grpc
        endpoint: http://otel-collector:4317

  log:
    console:
      enable: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [traceId=%X{traceId}] [%c] (%t) %s%e%n"
    level: INFO
    category:
      "com.wallet.auth": INFO

keycloak:
  admin:
    url: http://localhost:8180
    username: admin
    password: admin

wallet:
  auth:
    mfa:
      totp:
        algorithm: HmacSHA1
        digits: 6
        period: 30
        window: 1
      recovery-codes:
        count: 10
        length: 8
      rate-limit:
        max-attempts: 5
        lockout-duration: 300
