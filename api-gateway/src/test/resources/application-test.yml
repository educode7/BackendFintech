spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
    gateway:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.ReactiveRedisAutoConfiguration
      - org.springframework.cloud.config.client.ConfigClientAutoConfiguration
