# ─────────────────────────────────────────────────────────────────────────
# API Gateway — Bootstrap Config
# ─────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: api-gateway
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        max-attempts: 5
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.5
      timeout: 5000
