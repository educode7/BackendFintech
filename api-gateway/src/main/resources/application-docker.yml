spring:
  config:
    import: "configserver:http://config-service:8888"
  cloud:
    gateway:
      routes:
        - id: payment-service
          uri: http://payment-service:8081
          predicates:
            - Path=/api/v1/payments/**
        - id: account-service
          uri: http://account-service:8082
          predicates:
            - Path=/api/v1/accounts/**
        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/api/v1/notifications/**

  data:
    redis:
      host: redis
      port: 6379
