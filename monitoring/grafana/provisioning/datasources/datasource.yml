apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        # Log line -> Tempo trace ("traceId=<hex>" appears in Quarkus log patterns).
        # '$$' escapes '$' for Grafana provisioning env-var interpolation.
        - datasourceUid: tempo
          matcherRegex: 'traceId=(\w+)'
          name: traceId
          url: '$${__value.raw}'
          urlDisplayLabel: 'View trace'

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # Trace -> Loki logs: content filter, since traceId is not a Loki label.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{$${__tags}} |= "$${__trace.traceId}"'
        tags:
          - key: 'service.name'
            value: 'service'
      # Trace metrics -> Prometheus (service map / span metrics).
      serviceMap:
        datasourceUid: Prometheus
      tracesToMetrics:
        datasourceUid: Prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        queries:
          - name: 'Request rate'
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: 'Duration p90'
            query: 'histogram_quantile(0.9, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'
