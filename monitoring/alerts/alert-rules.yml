groups:
  - name: backend-fintech
    rules:
      - alert: ServiceDown
        expr: up{job=~"api-gateway|payment-service|account-service|notification-service|auth-service"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} has been unreachable for 2 minutes."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..",job=~"api-gateway|payment-service|account-service|notification-service|auth-service"}[5m])) by (job)
            /
          sum(rate(http_server_requests_seconds_count{job=~"api-gateway|payment-service|account-service|notification-service|auth-service"}[5m])) by (job)
            > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "More than 5% of HTTP requests handled by job {{ $labels.job }} returned a 5xx status over the last 5 minutes."

      - alert: HighLatency
        expr: |
          sum(rate(http_server_requests_seconds_sum{job=~"api-gateway|payment-service|account-service|notification-service|auth-service"}[5m])) by (job)
            /
          sum(rate(http_server_requests_seconds_count{job=~"api-gateway|payment-service|account-service|notification-service|auth-service"}[5m])) by (job)
            > 1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High average latency on {{ $labels.job }}"
          description: "Average HTTP request latency for job {{ $labels.job }} has been above 1 second for 10 minutes."

      - alert: JvmHeapPressure
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.9
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "JVM heap pressure on {{ $labels.job }}"
          description: "JVM heap usage of job {{ $labels.job }} (instance {{ $labels.instance }}) has been above 90% for 10 minutes."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL target {{ $labels.instance }} is down"
          description: "pg_up is 0 for database {{ $labels.db }} on instance {{ $labels.instance }} for 2 minutes."
