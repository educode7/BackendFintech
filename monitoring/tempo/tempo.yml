# Tempo — single binary (monolithic / target=all), Tempo 3.x schema.
# Receives OTLP from otel-collector (tempo:4317 / tempo:4318 inside wallet-net).
# metrics_generator remote_write/registry/storage are prepared here; processors
# are enabled via overrides.defaults.metrics_generator.processors.
# Tempo 3.x removed top-level `ingester:` and `compactor:`; retention lives under
# backend_scheduler/backend_worker.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h

backend_worker:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]

usage_report:
  reporting_enabled: false
