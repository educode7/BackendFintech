# DEPRECATED — kept for history only; no longer mounted.
# Runtime uses the native collector instead:
#   --collector.stat_statements
#   --collector.stat_statements.include_query
#   --collector.stat_statements.limit=100
# Native metrics: pg_stat_statements_{seconds,calls,rows}_total, pg_stat_statements_query_id.
# The dashboard joins seconds/calls on queryid to compute mean exec time in ms.
# --extend.query-path returned HTTP 500 on this image/version and is deprecated upstream.
pg_stat_statements:
  query: |
    SELECT regexp_replace(left(query, 300), '\s+', ' ', 'g') AS query,
           calls,
           mean_exec_time,
           total_exec_time
    FROM pg_stat_statements
    WHERE query NOT ILIKE '%pg_stat_statements%'
  metrics:
    - query:
        usage: "LABEL"
        description: "SQL statement text (normalized, whitespace-collapsed, truncated to 300 chars)"
    - calls:
        usage: "COUNTER"
        description: "Number of times the statement has been executed"
    - mean_exec_time:
        usage: "GAUGE"
        description: "Mean statement execution time in milliseconds"
    - total_exec_time:
        usage: "COUNTER"
        description: "Total statement execution time in milliseconds"
