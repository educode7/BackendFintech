openapi: "3.1.0"
info:
  title: Payment Service API
  description: |
    Payment processing service for the Digital Wallet platform.

    ## Idempotency
    All `POST` operations require an `Idempotency-Key` header. The key must be a
    UUIDv7 (recommended) or UUIDv4, unique per logical operation. The server
    guarantees exactly-once processing per key within a 24-hour window.

    Duplicate requests return the cached original response. In-progress requests
    return `409 Conflict`.

    ## Error Format
    All errors follow RFC 9457 `application/problem+json`.
  version: "1.0.0"
  contact:
    name: Wallet Platform Team
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Versioned base path

security:
  - bearerAuth: []

tags:
  - name: Payments
    description: Payment creation and retrieval

paths:
  /payments:
    post:
      operationId: processPayment
      summary: Process a new payment
      description: |
        Creates a payment and transitions it to `PENDING` state.
        The payment is then published to Kafka for async processing.

        **Requires** `Idempotency-Key` header.
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessPaymentRequest"
            examples:
              basic:
                summary: Standard payment
                value:
                  userId: "user-01H5GQK7..."
                  amount:
                    amount: 25.50
                    currency: USD
      responses:
        "201":
          description: Payment created successfully
          headers:
            Location:
              description: URI of the created payment
              schema:
                type: string
                format: uri
                example: /api/v1/payments/01H5GQK7ABC123
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /payments/{id}:
    get:
      operationId: getPayment
      summary: Get payment by ID
      tags: [Payments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Payment internal ID (UUID)
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by Keycloak (RS256)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Unique idempotency key for this operation. UUIDv7 recommended.
        Must be the same on retries. Server caches responses for 24 hours.

  schemas:
    Money:
      type: object
      description: Monetary value with ISO-4217 currency
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: decimal
          minimum: 0.0001
          description: Amount as decimal string or number
          example: 25.50
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO-4217 currency code
          example: USD

    ProcessPaymentRequest:
      type: object
      description: Request to process a new payment
      required: [userId, amount]
      properties:
        userId:
          type: string
          maxLength: 64
          description: Identifier of the user initiating the payment
          example: "user-01H5GQK7..."
        amount:
          $ref: "#/components/schemas/Money"

    PaymentResponse:
      type: object
      description: Payment representation
      properties:
        id:
          type: string
          format: uuid
          description: Payment internal ID
          example: "01H5GQK7ABC123"
        userId:
          type: string
          description: User who initiated the payment
          example: "user-01H5GQK7..."
        amount:
          type: number
          format: decimal
          description: Payment amount
          example: 25.50
        currency:
          type: string
          description: ISO-4217 currency code
          example: USD
        status:
          $ref: "#/components/schemas/PaymentStatus"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC)

    PaymentStatus:
      type: string
      description: |
        Payment lifecycle state:
        - `PENDING` — Created, awaiting processing
        - `PROCESSING` — Being processed by the platform
        - `COMPLETED` — Successfully processed
        - `FAILED` — Processing failed
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    ErrorResponse:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type
          example: "urn:wallet:payment:DUPLICATE_PAYMENT"
        title:
          type: string
          description: Short human-readable summary
          example: "Duplicate Payment"
        status:
          type: integer
          description: HTTP status code
          example: 409
        detail:
          type: string
          description: Human-readable explanation
          example: "A payment with this idempotency key was already processed"
        instance:
          type: string
          format: uri
          description: URI reference to the specific occurrence
        code:
          type: string
          description: Machine-readable business error code
          example: "DUPLICATE_PAYMENT"
        correlationId:
          type: string
          description: Correlation ID for tracing
          example: "01H5GQK7XYZ789"
        timestamp:
          type: string
          format: date-time
          description: Error timestamp (UTC)

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            errors:
              type: array
              description: Field-level validation errors
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: "amount.currency"
                  message:
                    type: string
                    example: "must be a valid ISO-4217 code"

  responses:
    BadRequest:
      description: Invalid request (malformed JSON, missing required fields)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            type: "urn:wallet:payment:BAD_REQUEST"
            title: "Bad Request"
            status: 400
            detail: "Invalid JSON in request body"
            code: "BAD_REQUEST"

    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            type: "urn:wallet:UNAUTHORIZED"
            title: "Unauthorized"
            status: 401
            detail: "Bearer token is missing or expired"
            code: "UNAUTHORIZED"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            type: "urn:wallet:PAYMENT_NOT_FOUND"
            title: "Payment Not Found"
            status: 404
            detail: "No payment found with the given ID"
            code: "PAYMENT_NOT_FOUND"

    Conflict:
      description: |
        Idempotency conflict. Returned in two scenarios:
        1. **Duplicate** — Same Idempotency-Key, operation already completed → returns cached response
        2. **In Progress** — Same Idempotency-Key, operation still running → returns 409
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            duplicate:
              summary: Payment already processed
              value:
                type: "urn:wallet:DUPLICATE_PAYMENT"
                title: "Duplicate Payment"
                status: 409
                detail: "A payment with this idempotency key was already processed"
                code: "DUPLICATE_PAYMENT"
            inProgress:
              summary: Payment being processed
              value:
                type: "urn:wallet:REQUEST_IN_PROGRESS"
                title: "Request In Progress"
                status: 409
                detail: "The payment is being processed"
                code: "REQUEST_IN_PROGRESS"
                retryAfterMs: 500

    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            type: "urn:wallet:VALIDATION_ERROR"
            title: "Validation Error"
            status: 422
            detail: "Request body validation failed"
            code: "VALIDATION_ERROR"
            errors:
              - field: "amount.currency"
                message: "must be a valid ISO-4217 code"

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            type: "urn:wallet:RATE_LIMITED"
            title: "Too Many Requests"
            status: 429
            detail: "Rate limit exceeded. Try again in 30 seconds"
            code: "RATE_LIMITED"

    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            type: "urn:wallet:INTERNAL_ERROR"
            title: "Internal Server Error"
            status: 500
            detail: "An unexpected error occurred"
            code: "INTERNAL_ERROR"
