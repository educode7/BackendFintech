openapi: "3.1.0"
info:
  title: Notification Service API
  description: |
    Notification management service for the Digital Wallet platform.
    Consumes payment events from Kafka and dispatches notifications.

    ## Error Format
    All errors follow RFC 9457 `application/problem+json`.
  version: "1.0.0"
  contact:
    name: Wallet Platform Team
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Versioned base path

security:
  - bearerAuth: []

tags:
  - name: Notifications
    description: Notification retrieval

paths:
  /notifications/{userId}:
    get:
      operationId: listNotificationsByUser
      summary: List notifications for a user
      description: |
        Returns paginated notifications for the specified user.
        Results are ordered by creation date descending.
      tags: [Notifications]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: User ID to filter notifications
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based page index
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
      responses:
        "200":
          description: Paginated notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by Keycloak (RS256)

  schemas:
    NotificationType:
      type: string
      description: Notification delivery channel
      enum: [EMAIL, PUSH]

    NotificationStatus:
      type: string
      description: |
        Notification state:
        - `PENDING` — Created, awaiting dispatch
        - `SENT` — Successfully dispatched
        - `FAILED` — Dispatch failed
      enum: [PENDING, SENT, FAILED]

    Notification:
      type: object
      description: Notification representation
      properties:
        id:
          type: string
          format: uuid
          description: Notification ID
          example: "01H5GQK7NOTIF1"
        userId:
          type: string
          description: Recipient user ID
          example: "user-01H5GQK7..."
        type:
          $ref: "#/components/schemas/NotificationType"
        subject:
          type: string
          description: Notification subject/title
          example: "Payment Completed"
        body:
          type: string
          description: Notification body text
          example: "Your payment of 25.50 USD has been processed."
        status:
          $ref: "#/components/schemas/NotificationStatus"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
        sentAt:
          type: string
          format: date-time
          nullable: true
          description: Dispatch timestamp (UTC), null if not yet sent

    NotificationPageResponse:
      type: object
      description: Paginated response wrapper
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
          format: int64
          description: Total number of notifications for the user
          example: 42
        page:
          type: integer
          description: Current zero-based page index
          example: 0
        size:
          type: integer
          description: Page size
          example: 20

    ErrorResponse:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          example: "urn:wallet:notification:INTERNAL_ERROR"
        title:
          type: string
          example: "Internal Server Error"
        status:
          type: integer
          example: 500
        detail:
          type: string
          example: "An unexpected error occurred"
        instance:
          type: string
          format: uri
        code:
          type: string
          example: "INTERNAL_ERROR"
        correlationId:
          type: string
          example: "01H5GQK7XYZ789"
        timestamp:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
