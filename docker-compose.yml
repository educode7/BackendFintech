name: wallet

services:

  # ─────────────────────────────── Postgres ───────────────────────────────
  postgres:
    name: wallet-postgres
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Redis ───────────────────────────────
  redis:
    name: wallet-redis
    image: redis:7-alpine
    container_name: wallet-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Kafka (KRaft, no Zookeeper) ───────────────────────────────
  kafka:
    name: wallet-kafka
    image: bitnami/kafka:3.7
    container_name: wallet-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "wallet-cluster-0001"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Keycloak ───────────────────────────────
  keycloak:
    name: wallet-keycloak
    image: quay.io/keycloak/keycloak:25.0
    container_name: wallet-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: dev-file
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Config Server ───────────────────────────────
  config-service:
    name: wallet-config-service
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: wallet-config-service
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:///config-repo"
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Observability ───────────────────────────────
  otel-collector:
    name: wallet-otel-collector
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: wallet-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8888"   # Collector metrics (8889 to avoid conflict with config-service)
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml:ro
    networks:
      - wallet-net
    restart: unless-stopped

  jaeger:
    name: wallet-jaeger
    image: jaegertracing/all-in-one:1.62
    container_name: wallet-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC
    networks:
      - wallet-net
    restart: unless-stopped

  prometheus:
    name: wallet-prometheus
    image: prom/prometheus:v2.55.1
    container_name: wallet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api-gateway
      - payment-service
      - account-service
      - notification-service
      - auth-service
    networks:
      - wallet-net
    restart: unless-stopped

  grafana:
    name: wallet-grafana
    image: grafana/grafana:11.3.0
    container_name: wallet-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-me
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Application services (Quarkus) ───────────────────────────────
  api-gateway:
    name: wallet-api-gateway
    build:
      context: .
      dockerfile: api-gateway-quarkus/Dockerfile
    container_name: wallet-api-gateway
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_CONFIG_LOCATIONS: "optional:classpath:/application.yml,optional:classpath:/application-docker.yml"
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  payment-service:
    name: wallet-payment-service
    build:
      context: .
      dockerfile: payment-service-quarkus/Dockerfile
    container_name: wallet-payment-service
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_CONFIG_LOCATIONS: "optional:classpath:/application.yml,optional:classpath:/application-docker.yml"
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  account-service:
    name: wallet-account-service
    build:
      context: .
      dockerfile: account-service-quarkus/Dockerfile
    container_name: wallet-account-service
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_CONFIG_LOCATIONS: "optional:classpath:/application.yml,optional:classpath:/application-docker.yml"
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  notification-service:
    name: wallet-notification-service
    build:
      context: .
      dockerfile: notification-service-quarkus/Dockerfile
    container_name: wallet-notification-service
    ports:
      - "8083:8083"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_CONFIG_LOCATIONS: "optional:classpath:/application.yml,optional:classpath:/application-docker.yml"
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  auth-service:
    name: wallet-auth-service
    build:
      context: .
      dockerfile: auth-service-quarkus/Dockerfile
    container_name: wallet-auth-service
    ports:
      - "8084:8084"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_CONFIG_LOCATIONS: "optional:classpath:/application.yml,optional:classpath:/application-docker.yml"
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

networks:
  wallet-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
