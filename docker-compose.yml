services:
  # ─────────────────────────────── Infrastructure ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-net
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: wallet-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "echo | nc -w 2 localhost 9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - wallet-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: wallet-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_FEATURES: preview
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8180 || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Config ─────────────────────────────────────
  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: wallet-config-service
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:///config-repo"
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8888 || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Observability ───────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: wallet-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Collector metrics
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml:ro
    networks:
      - wallet-net
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: wallet-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250"
    networks:
      - wallet-net
    restart: unless-stopped

  # ─────────────────────────────── Application ────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway-quarkus/Dockerfile
    container_name: wallet-api-gateway
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/wallet
      QUARKUS_OIDC_CLIENT_ID: wallet-backend
      QUARKUS_OIDC_APPLICATION_TYPE: service
      QUARKUS_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_SMALLRYE_HEALTH_ENABLED: "true"
      WALLET_GATEWAY_ROUTES_PAYMENT_SERVICE_URL: http://payment-service:8081
      WALLET_GATEWAY_ROUTES_ACCOUNT_SERVICE_URL: http://account-service:8082
      WALLET_GATEWAY_ROUTES_NOTIFICATION_SERVICE_URL: http://notification-service:8083
      WALLET_GATEWAY_ROUTES_AUTH_SERVICE_URL: http://auth-service:8084
    command: ["-Dquarkus.profile=docker", "-Dkafka.bootstrap.servers=kafka:9092", "-jar", "quarkus-app/quarkus-run.jar"]
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service-quarkus/Dockerfile
    container_name: wallet-payment-service
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: wallet
      QUARKUS_DATASOURCE_PASSWORD: change-me
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/payments_db
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/payments_db
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      QUARKUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/wallet
      QUARKUS_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      WALLET_IDEMPOTENCY_TTL_HOURS: "24"
    command: ["-Dquarkus.profile=docker", "-Dkafka.bootstrap.servers=kafka:9092", "-jar", "quarkus-app/quarkus-run.jar"]
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  account-service:
    build:
      context: .
      dockerfile: account-service-quarkus/Dockerfile
    container_name: wallet-account-service
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: wallet
      QUARKUS_DATASOURCE_PASSWORD: change-me
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/wallet
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/wallet
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      QUARKUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/wallet
      QUARKUS_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["-Dquarkus.profile=docker", "-Dkafka.bootstrap.servers=kafka:9092", "-jar", "quarkus-app/quarkus-run.jar"]
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service-quarkus/Dockerfile
    container_name: wallet-notification-service
    ports:
      - "8083:8083"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: wallet
      QUARKUS_DATASOURCE_PASSWORD: change-me
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/notifications_db
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/notifications_db
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      QUARKUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/wallet
      QUARKUS_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["-Dquarkus.profile=docker", "-Dkafka.bootstrap.servers=kafka:9092", "-jar", "quarkus-app/quarkus-run.jar"]
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service-quarkus/Dockerfile
    container_name: wallet-auth-service
    ports:
      - "8084:8084"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/wallet
      QUARKUS_OIDC_CLIENT_ID: wallet-backend
      QUARKUS_OIDC_CREDENTIALS_SECRET: p4PPO2LQkZfJfMOeQ4xYoXs541tpxmzC
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8180/realms/wallet
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      QUARKUS_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_SMALLRYE_HEALTH_ENABLED: "true"
    command: ["-Dquarkus.profile=docker", "-Dkafka.bootstrap.servers=kafka:9092", "-jar", "quarkus-app/quarkus-run.jar"]
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - wallet-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: wallet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - wallet-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: wallet-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - wallet-net
    restart: unless-stopped

networks:
  wallet-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
