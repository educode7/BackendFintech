receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:4200"
            - "http://127.0.0.1:4200"
            - "http://localhost:3000"
          allowed_headers:
            - "Content-Type"
            - "Authorization"
          max_age: 7200

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Debug exporter for development (logs traces to stdout)
  debug:
    verbosity: detailed

  # Send to Tempo for trace storage and Grafana querying
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Send to Prometheus as metrics
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: wallet

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
