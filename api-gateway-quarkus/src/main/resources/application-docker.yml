%docker:
  quarkus:
    redis:
      host: redis
      port: 6379

    oidc:
      auth-server-url: http://keycloak:8180/realms/wallet

    opentelemetry:
      exporter:
        otlp:
          endpoint: http://otel-collector:4317

  wallet:
    gateway:
      routes:
        payment-service:
          url: http://payment-service:8081
        account-service:
          url: http://account-service:8082
        notification-service:
          url: http://notification-service:8083
        auth-service:
          url: http://auth-service:8084
