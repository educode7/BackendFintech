quarkus:
  application:
    name: api-gateway
    version: 1.0.0

  http:
    port: 8080
    host: 0.0.0.0

  redis:
    hosts: redis://localhost:6379

  oidc:
    auth-server-url: http://localhost:8180/realms/wallet
    client-id: wallet-backend
    enabled: false
    application-type: service
    credentials:
      secret: secret

  smallrye-health:
    enabled: true
    expose:
      enabled: true

  opentelemetry:
    enabled: true
    service:
      name: api-gateway
    exporter:
      otlp:
        endpoint: http://localhost:4317

  micrometer:
    export:
      prometheus:
        enabled: true

  log:
    console:
      enable: true
    level: INFO
    category:
      "com.wallet.gateway": INFO

wallet:
  gateway:
    routes:
      payment-service:
        url: http://payment-service:8081
        path: /api/v1/payments
      account-service:
        url: http://account-service:8082
        path: /api/v1/accounts
      notification-service:
        url: http://notification-service:8083
        path: /api/v1/notifications
      auth-service:
        url: http://auth-service:8084
        path: /api/v1/auth
    rate-limit:
      replenish-rate: 100
      burst-capacity: 200
