spring:
  application:
    name: notification-service
  profiles:
    active: default
  config:
    import: "optional:configserver:"

  # ── Virtual Threads (JDK 21+ / Spring Boot 4) ────────────────────────
  # Every request, Kafka listener, and @Async task runs on a virtual thread.
  # Notification dispatch (SMTP) is blocking — virtual threads handle it
  # without blocking platform threads.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db
    username: wallet
    password: change-me
    hikari:
      # Notification-service has lighter DB load — 15 connections is enough.
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 5000
      # Leak detection: log a warning if a connection is held >5s.
      leak-detection-threshold: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # ── Batch writing ──────────────────────────────────────────────
        # Notification writes are sequential (one per event), but batch_size
        # helps when the projection service does bulk updates.
        batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: false

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.wallet: INFO

wallet:
  consumer-idempotency:
    ttl-days: 7
