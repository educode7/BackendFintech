# ─────────────────────────────────────────────────────────────────────────
# Shared configuration applied to ALL services
# ─────────────────────────────────────────────────────────────────────────
spring:
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/wallet
          jwk-set-uri: http://localhost:8180/realms/wallet/protocol/openid-connect/certs

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  hikari:
    minimum-idle: 5
    connection-timeout: 5000
    leak-detection-threshold: 5000
    idle-timeout: 600000
    max-lifetime: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.wallet: INFO
