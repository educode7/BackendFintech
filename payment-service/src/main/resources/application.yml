spring:
  application:
    name: payment-service
  profiles:
    active: default
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 5
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.5
      timeout: 5000

  # ── Virtual Threads (JDK 21+ / Spring Boot 4) ────────────────────────
  # Every request, Kafka listener, and @Async task runs on a virtual thread.
  # This means thousands of concurrent DB/HTTP calls without exhausting OS threads.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: wallet
    password: change-me
    hikari:
      # With virtual threads, the bottleneck shifts from thread count to DB connections.
      # 20 is the sweet spot for PostgreSQL: enough to pipeline concurrent writes,
      # few enough to avoid connection exhaustion under normal load.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      validation-timeout: 3000
      # Leak detection: log a warning if a connection is held >5s (indicates a bug).
      leak-detection-threshold: 5000
      # Idle connections reaped after 10min.
      idle-timeout: 600000
      # Max lifetime 30min.
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # ── Batch writing ──────────────────────────────────────────────
        # Hibernate accumulates inserts/updates and flushes them in batches of 25.
        # Reduces round-trips to Postgres by ~10x for bulk operations (event replay).
        batch_size: 25
        order_inserts: true
        order_updates: true
        # ── Read batch (fetch) ─────────────────────────────────────────
        # When loading collections, fetch 25 rows at a time instead of 1 (N+1 killer).
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: snappy
        linger.ms: 20
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      paymentProducer:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  level:
    root: INFO
    com.wallet: INFO

wallet:
  idempotency:
    ttl-hours: 24
