global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /q/metrics
    static_configs:
      - targets: ["api-gateway-quarkus:8080"]

  - job_name: payment-service
    metrics_path: /q/metrics
    static_configs:
      - targets: ["payment-service-quarkus:8081"]

  - job_name: account-service
    metrics_path: /q/metrics
    static_configs:
      - targets: ["account-service-quarkus:8082"]

  - job_name: notification-service
    metrics_path: /q/metrics
    static_configs:
      - targets: ["notification-service-quarkus:8083"]
