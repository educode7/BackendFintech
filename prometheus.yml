global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  # Only rule files: alertmanager.yml also lives in this folder and must not
  # be parsed as Prometheus rules (it would crash Prometheus at startup).
  - /etc/prometheus/alerts/*-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /q/metrics
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: payment-service
    metrics_path: /q/metrics
    static_configs:
      - targets: ["payment-service:8081"]

  - job_name: account-service
    metrics_path: /q/metrics
    static_configs:
      - targets: ["account-service:8082"]

  - job_name: notification-service
    metrics_path: /q/metrics
    static_configs:
      - targets: ["notification-service:8083"]

  - job_name: auth-service
    metrics_path: /q/metrics
    static_configs:
      - targets: ["auth-service:8084"]

  # pg_stat_statements exporters — one instance per app database.
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter-wallet:9187"]
        labels: { db: "wallet" }
      - targets: ["postgres-exporter-payments:9187"]
        labels: { db: "payments_db" }
      - targets: ["postgres-exporter-notifications:9187"]
        labels: { db: "notifications_db" }
